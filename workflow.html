<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broadcast Workflow Builder</title>
<style>
  :root{
    --bg:#0D0F12; --panel:#171A1F; --panel2:#1E2229; --line:#3A3F47;
    --amber:#F2A93B; --teal:#4FD1C5; --violet:#B694F7; --text:#E9E7E2; --sub:#9AA0A8;
    --yellow:#FFD43B; --pink:#FF6FA5; --red:#E63946; --orange:#FF922B;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;}
  header{padding:14px 18px 10px;border-bottom:1px solid var(--line);}
  h1{font-size:1.15rem;margin:0 0 4px;}
  h1 span{color:var(--amber);}
  p{margin:0;color:var(--sub);font-size:.82rem;}
  .layout{display:flex;flex:1;min-height:0;}
  .palette{width:210px;flex:0 0 210px;border-right:1px solid var(--line);overflow-y:auto;padding:10px;}
  .palette h2{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--sub);margin:14px 4px 6px;}
  .palette h2:first-child{margin-top:2px;}
  .pitem{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer;font-size:.82rem;text-align:left;}
  .pitem:hover{border-color:var(--amber);}
  .pitem svg{width:18px;height:18px;flex:none;color:var(--teal);}
  .canvas-wrap{flex:1;position:relative;overflow:auto;background:
    linear-gradient(var(--panel) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--panel) 1px,transparent 1px) 0 0/28px 28px, var(--bg);}
  svg#board{width:2200px;height:1400px;display:block;}
  .toolbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap;}
  button.tb{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;}
  button.tb.active{border-color:var(--amber);color:var(--amber);}
  button.tb:hover{border-color:var(--teal);}
  .hint{color:var(--sub);font-size:.78rem;margin-left:auto;}
  .node rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.3;}
  .node.cat-src rect{stroke:var(--violet);}
  .node.cat-core rect{stroke:var(--teal);}
  .node.cat-out rect{stroke:var(--amber);}
  .node.cat-net rect{stroke:var(--yellow);}
  .node.cat-prod rect{stroke:var(--pink);}
  .node.cat-mam rect{stroke:var(--red);}
  .node.cat-dev rect{stroke:var(--orange);}
  .node.selected rect{stroke:var(--amber);stroke-width:2.4;}
  .node .title{fill:var(--text);font-size:13px;font-weight:700;font-family:inherit;}
  .node .ic{color:var(--teal);}
  .edge{stroke:#5A6270;stroke-width:1.6;fill:none;marker-end:url(#arrow);cursor:pointer;}
  .edge.pending{stroke:var(--teal);stroke-dasharray:4 3;}
  .node .fmt{fill:var(--amber);font-size:10px;font-family:inherit;}
  .modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;align-items:center;justify-content:center;padding:16px;}
  .modal-back.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(430px,100%);max-height:88vh;overflow:auto;padding:16px 16px 14px;box-shadow:0 20px 48px rgba(0,0,0,.55);}
  .modal h3{margin:0 0 14px;font-size:1rem;}
  .field{margin-bottom:14px;}
  .flabel{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:6px;}
  .field input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:.86rem;font-family:inherit;}
  .field input[type=text]:focus{outline:none;border-color:var(--amber);}
  .chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 10px;}
  .ch-row{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0;}
  .ch-row span{font-size:.74rem;font-weight:700;color:var(--teal);flex:none;}
  .ch-row select{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-size:.72rem;font-family:inherit;padding:3px 1px;cursor:pointer;text-overflow:ellipsis;}
  .ch-row select:focus{outline:none;}
  .ch-row select option{background:#1E2229;color:var(--text);}
  .ch-row.off{opacity:.55;}
  .ch-row.off span{color:var(--sub);}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
  .info-pop{display:none;position:absolute;z-index:20;width:270px;background:#fff;color:#141414;
    border-radius:12px;padding:12px 14px 11px;cursor:default;
    box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.18),0 22px 44px rgba(0,0,0,.28);}
  .info-pop.open{display:block;animation:popLift .2s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes popLift{
    from{opacity:0;transform:perspective(800px) translateY(14px) rotateX(12deg);transform-origin:top center;}
    to{opacity:1;transform:perspective(800px) translateY(-4px) rotateX(0deg);transform-origin:top center;}
  }
  .info-pop::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-7px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-radius:3px;box-shadow:-3px -3px 8px rgba(0,0,0,.10);}
  .info-pop h4{margin:0;font-size:.95rem;color:#111;line-height:1.25;display:flex;align-items:center;gap:7px;}
  .info-pop h4 .dot{width:9px;height:9px;border-radius:3px;flex:none;}
  .info-pop h4 + dl{margin-top:9px;}
  .info-pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:baseline;
    border-top:1px solid #E6E8EB;padding-top:8px;}
  .info-pop dt{font-size:.66rem;letter-spacing:.5px;text-transform:uppercase;color:#8A9099;white-space:nowrap;}
  .info-pop dt.sect{grid-column:1 / -1;margin-top:7px;padding-top:8px;border-top:1px solid #EDEFF1;color:#6B7280;font-weight:700;}
  .info-pop dd{margin:0;font-size:.8rem;font-weight:600;color:#141414;text-align:right;word-break:break-word;}
  .info-pop .close-hint{margin:9px 0 0;font-size:.66rem;color:#9AA0A8;text-align:center;}
  body.view-mode .palette,
  body.view-mode #connectBtn,
  body.view-mode #delEdgeBtn,
  body.view-mode #clearBtn,
  body.view-mode #importBtn{display:none;}
  body.view-mode .node{cursor:default;}
  #viewToggle.active{border-color:var(--amber);color:var(--amber);}
</style>
</head>
<body>
<header>
  <h1>Broadcast Workflow <span>Builder</span></h1>
  <p>เลือกไอคอนจากด้านซ้ายเพื่อวางบนกระดาน ลากย้ายตำแหน่งได้ กด "เชื่อมเส้น" แล้วคลิกโหนด 2 อัน เพื่อวาดลูกศรเส้นสัญญาณ</p>
</header>
<div class="layout">
  <div class="palette" id="palette"></div>
  <div class="canvas-wrap">
    <svg id="board" viewBox="0 0 2200 1400">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#5A6270"/>
        </marker>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
    <div class="info-pop" id="infoPop"></div>
  </div>
</div>
<div class="toolbar">
  <button class="tb" id="viewToggle">👁️ โหมดดูอย่างเดียว</button>
  <button class="tb" id="connectBtn">🔗 เชื่อมเส้น</button>
  <button class="tb" id="delEdgeBtn">✂️ ลบเส้นที่เลือก</button>
  <button class="tb" id="clearBtn">🗑️ ล้างทั้งหมด</button>
  <button class="tb" id="importBtn">📂 Import</button>
  <button class="tb" id="exportBtn">💾 Export</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <span class="hint" id="hint">คลิกไอคอนซ้ายมือเพื่อเพิ่มโหนด · ดับเบิลคลิกที่โหนดเพื่อดู/แก้ฟอร์แมท · เลือกโหนดแล้วกด Delete เพื่อลบ</span>
</div>

<div class="modal-back" id="nodeModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">รายละเอียดโหนด</h3>
    <div class="field">
      <span class="flabel">ชื่อโหนด</span>
      <input type="text" id="fName" autocomplete="off">
    </div>
    <div class="field">
      <span class="flabel">Video</span>
      <input type="text" id="fVideo" autocomplete="off">
    </div>
    <div class="field">
      <span class="flabel">Audio channels</span>
      <div class="chgrid" id="fChips"></div>
    </div>
    <div class="actions">
      <button class="tb" id="mCancel" type="button">ยกเลิก</button>
      <button class="tb active" id="mSave" type="button">บันทึก</button>
    </div>
  </div>
</div>

<script>
const ICONS = {
  obvan:'<rect x="2" y="10" width="14" height="7" rx="1"/><path d="M16 12h4l2 3v2h-6z"/><circle cx="6.5" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/>',
  location:'<path d="M12 21s7-7.2 7-12a7 7 0 10-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4" fill="var(--bg)"/>',
  ingest:'<rect x="4" y="10" width="16" height="9" rx="2" fill="none"/><path d="M12 2v10M8 9l4 4 4-4" fill="none"/>',
  daft:'<circle cx="12" cy="12" r="6.5" fill="none"/><circle cx="12" cy="12" r="2.2" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" fill="none"/>',
  rec:'<circle cx="12" cy="12" r="9" fill="none"/><circle cx="12" cy="12" r="5"/>',
  aveco:'<rect x="2.5" y="5" width="19" height="14" rx="3" fill="none"/><path d="M10 9.5l5 2.5-5 2.5z"/>',
  marina:'<ellipse cx="12" cy="6" rx="7.5" ry="3" fill="none"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6" fill="none"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3" fill="none"/>',
  prodrive:'<rect x="3" y="4" width="18" height="6.5" rx="1.5" fill="none"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.5" fill="none"/><circle cx="7" cy="7.2" r="1.2"/><circle cx="7" cy="16.7" r="1.2"/>',
  social:'<circle cx="6" cy="12" r="2.3"/><circle cx="17" cy="6" r="2.3"/><circle cx="17" cy="18" r="2.3"/><path d="M8.1 10.7L14.9 7.1M8.1 13.3l6.8 3.6" fill="none"/>',
  facebook_thairath:'<rect x="4" y="3" width="16" height="18" rx="2" fill="none"/><path d="M8 8h8M8 12h8M8 16h5" fill="none"/>',
  youtube_thairath:'<rect x="3" y="6" width="18" height="12" rx="3" fill="none"/><path d="M10 9.5l6 2.5-6 2.5z"/>',
  tv:'<rect x="3" y="6" width="18" height="12" rx="2" fill="none"/><path d="M8 3l4 3 4-3M7 21h10" fill="none"/>',
  satellite:'<path d="M3 13a10 10 0 0110-10" fill="none"/><path d="M3 13l7 7" fill="none"/><circle cx="17" cy="17" r="2"/><path d="M17 17L21 21" fill="none"/>',
  stu1:'<rect x="3" y="5" width="18" height="13" rx="2" fill="none"/><path d="M12 18v3M9 21h6" fill="none"/><text x="12" y="15" font-size="8" text-anchor="middle" font-weight="700">1</text>',
  stu2:'<rect x="3" y="5" width="18" height="13" rx="2" fill="none"/><path d="M12 18v3M9 21h6" fill="none"/><text x="12" y="15" font-size="8" text-anchor="middle" font-weight="700">2</text>',
  stu3:'<rect x="3" y="5" width="18" height="13" rx="2" fill="none"/><path d="M12 18v3M9 21h6" fill="none"/><text x="12" y="15" font-size="8" text-anchor="middle" font-weight="700">3</text>',
  dub1:'<rect x="10" y="2" width="4" height="8" rx="2"/><path d="M7 9a5 5 0 0010 0" fill="none"/><path d="M12 14v4M9 21h6" fill="none"/><text x="20" y="7" font-size="7" text-anchor="middle" font-weight="700">1</text>',
  dub2:'<rect x="10" y="2" width="4" height="8" rx="2"/><path d="M7 9a5 5 0 0010 0" fill="none"/><path d="M12 14v4M9 21h6" fill="none"/><text x="20" y="7" font-size="7" text-anchor="middle" font-weight="700">2</text>',
  embed:'<rect x="4" y="13" width="16" height="7" rx="1" fill="none"/><path d="M12 2v9M8 8l4 4 4-4" fill="none"/>',
  deembed:'<rect x="4" y="4" width="16" height="7" rx="1" fill="none"/><path d="M12 22v-9M8 16l4-4 4 4" fill="none"/>',
  da:'<rect x="9" y="9" width="6" height="6" rx="1"/><path d="M12 9V3M12 21v-6M9 12H3M21 12h-6M6 6l3 3M18 6l-3 3M6 18l3-3M18 18l-3-3" fill="none"/>',
  router:'<rect x="3" y="3" width="7" height="7" rx="1" fill="none"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none"/><rect x="3" y="14" width="7" height="7" rx="1" fill="none"/><rect x="14" y="14" width="7" height="7" rx="1" fill="none"/><path d="M10 6.5h4M6.5 10v4M17.5 10v4M10 17.5h4" fill="none"/>',
  mcr:'<rect x="2" y="4" width="20" height="13" rx="1" fill="none"/><path d="M2 8h20M8 4v13M15 4v13" fill="none"/><path d="M9 21h6" fill="none"/>',
  dubbing:'<rect x="10" y="2" width="4" height="9" rx="2"/><path d="M6 10a6 6 0 0012 0M12 16v5M8 20h8" fill="none"/><path d="M3 13v3M20 13v3" fill="none"/>'
};
const LABELS = {
  obvan:'OB VAN', location:'LOCATION',
  ingest:'INGEST',social:'SOCIAL',facebook_thairath:'FACEBOOK THAIRATH',youtube_thairath:'YOUTUBE THAIRATH',tv:'TV',satellite:'SATELLITE',
  daft:'DAFT',rec:'REC',aveco:'AVECO',marina:'MARINA',prodrive:'PRODRIVE',
  stu1:'STU1',stu2:'STU2',stu3:'STU3',dub1:'DUB1',dub2:'DUB2',
  embed:'EMBED',deembed:'DE-EMBED',
  da:'DA',router:'ROUTER',mcr:'MCR',dubbing:'DUBBING'
};
const CAT = {
  obvan:'src',location:'src',
  ingest:'src',social:'src',facebook_thairath:'src',youtube_thairath:'src',tv:'src',satellite:'src',
  stu1:'core',stu2:'core',stu3:'core',dub1:'core',dub2:'core',
  daft:'core',rec:'core',aveco:'core',marina:'core',prodrive:'core',
  router:'core',mcr:'core',deembed:'core'
};
const FEED_IDS = Array.from({length:20}, (_,i)=>'feed'+(i+1));
FEED_IDS.forEach((k,i)=>{
  ICONS[k] = ICONS.ingest;
  LABELS[k] = 'FEED '+(i+1);
  CAT[k] = 'src';
});
const DEVICE_IDS = ['lu800-1','lu600-1','lu600-2','lu300-1','lu300-2','lu300-3','lu300-4','lu300-5','solo-pro','solo-1','solo-2','solo-3','solo-4','solo-5','solo-6'];
DEVICE_IDS.forEach(k=>{
  ICONS[k] = k.startsWith('lu')
    ? '<rect x="4" y="7" width="16" height="13" rx="2" fill="none"/><path d="M8 7V4M16 7V4" fill="none"/><path d="M8 17v-3M12 17v-5M16 17v-7" fill="none"/>'
    : '<rect x="8" y="6" width="8" height="15" rx="2" fill="none"/><path d="M12 6V2" fill="none"/><circle cx="12" cy="2" r="1.4"/><path d="M10 16h4M10 19h4" fill="none"/>';
  LABELS[k] = k.toUpperCase();
  CAT[k] = 'src';
});
const GROUPS = [
  ['แหล่งสัญญาณ',['obvan','location',...FEED_IDS]],
  ['ควบคุม/ประมวลผล',['stu1','stu2','stu3','dub1','dub2','embed','deembed','da']],
  ['เครือข่ายหลัก',['tv','facebook_thairath','youtube_thairath','satellite','social','router','mcr']],
  ['ผลผลิต',['dubbing']],
  ['MAM / ITB',['ingest','daft','rec','aveco','marina','prodrive']],
  ['DEVICE', DEVICE_IDS]
];
const GROUP_STROKE = {'เครือข่ายหลัก':'net', 'ผลผลิต':'prod', 'MAM / ITB':'mam', 'DEVICE':'dev'};
GROUPS.forEach(([title, types])=>{
  const cat = GROUP_STROKE[title];
  if(cat) types.forEach(t => CAT[t] = cat);
});
let nodes = [], edges = [], nextId = 1, connectMode = false, pendingFrom = null, selectedEdge = null, selectedNode = null, viewMode = false;
const svgNodes = document.getElementById('nodes');
const svgEdges = document.getElementById('edges');
const KEY = 'bcast_workflow_v1';

function iconSvg(type){return `<svg viewBox="0 0 24 24" fill="currentColor">${ICONS[type]}</svg>`;}
function esc(s){return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const VIDEO_DEFAULT = '1080i50';
const CHANNELS = ['L1','R1','L2','R2','L3','R3','L4','R4'];
const CH_OPTIONS = ['none','Full Mix','Thai Commentary Mix','English Commentary Mix','International Sound'];
const CH_DEFAULT = {};
CHANNELS.forEach(c => CH_DEFAULT[c] = (c === 'L1' || c === 'R1') ? 'Full Mix' : 'none');

function chMap(f){
  const c = f && f.ch;
  if(c && !Array.isArray(c)) return Object.assign({}, CH_DEFAULT, c);
  const m = Object.assign({}, CH_DEFAULT);
  if(Array.isArray(c)) CHANNELS.forEach(k => { if(c.indexOf(k) >= 0) m[k] = 'Full Mix'; });
  return m;
}
function chActive(f){
  const m = chMap(f);
  return CHANNELS.filter(c => m[c] && m[c] !== 'none');
}
function chText(f){
  const m = chMap(f);
  const act = CHANNELS.filter(c => m[c] && m[c] !== 'none');
  return act.length ? act.map(c => c + ' → ' + m[c]).join(', ') : 'ไม่มีช่องเสียง';
}

function clip(s, max){ s = String(s); if(s.length <= max) return s; return s.slice(0, max-1).replace(/\s+$/,'') + '…'; }
function fmtLine(n){
  const f = n.fmt; if(!f) return '';
  return `${f.video || VIDEO_DEFAULT} · ${chActive(f).length}ch`;
}
function fmtDetail(n){
  const f = n.fmt; if(!f) return '';
  return `Video: ${f.video || VIDEO_DEFAULT} | Audio: ${chText(f)}`;
}

let modalNode = null;
const modal = document.getElementById('nodeModal');
const fName = document.getElementById('fName');
const fVideo = document.getElementById('fVideo');
const fChips = document.getElementById('fChips');

function openNodeDialog(n){
  modalNode = n;
  const f = n.fmt || {};
  fName.value = n.label || LABELS[n.type] || '';
  fVideo.value = f.video || VIDEO_DEFAULT;

  const cm = chMap(f);
  fChips.innerHTML = CHANNELS.map(c=>`
    <label class="ch-row${cm[c] === 'none' ? ' off' : ''}">
      <span>${c}</span>
      <select data-ch="${c}">${CH_OPTIONS.map(o=>`<option value="${esc(o)}"${cm[c] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>
    </label>`).join('');
  fChips.querySelectorAll('select').forEach(sel=>{
    sel.onchange = ()=> sel.closest('.ch-row').classList.toggle('off', sel.value === 'none');
  });

  const ro = viewMode;
  fName.disabled = ro; fVideo.disabled = ro;
  fChips.querySelectorAll('select').forEach(s=> s.disabled = ro);
  document.getElementById('mSave').style.display = ro ? 'none' : '';
  document.getElementById('mCancel').textContent = ro ? 'ปิด' : 'ยกเลิก';

  modal.classList.add('open');
}
function closeNodeDialog(){ modal.classList.remove('open'); modalNode = null; }
function saveNodeDialog(){
  if(!modalNode) return;
  const name = fName.value.trim();
  if(name) modalNode.label = name;
  const ch = {};
  fChips.querySelectorAll('select').forEach(sel => ch[sel.dataset.ch] = sel.value);
  modalNode.fmt = {
    video: fVideo.value.trim() || VIDEO_DEFAULT,
    ch: ch
  };
  closeNodeDialog(); render(); save();
}
document.getElementById('mSave').onclick = saveNodeDialog;
document.getElementById('mCancel').onclick = closeNodeDialog;
modal.addEventListener('click', e=>{ if(e.target === modal) closeNodeDialog(); });
window.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(modal.classList.contains('open')) closeNodeDialog();
    else if(infoNode) hideInfo();
    else if(selectedNode){ selectedNode = null; render(); }
    return;
  }
  if(e.key !== 'Delete' && e.key !== 'Backspace') return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if(modal.classList.contains('open') || viewMode) return;
  if(selectedNode){ e.preventDefault(); removeNode(selectedNode); }
  else if(selectedEdge){ e.preventDefault(); edges = edges.filter(x=>x!==selectedEdge); selectedEdge=null; render(); save(); }
});

const pop = document.getElementById('infoPop');
const boardEl = document.getElementById('board');
let infoNode = null;
const CAT_COLOR = {src:'var(--violet)', core:'var(--teal)', out:'var(--amber)', net:'var(--yellow)', prod:'var(--pink)', mam:'var(--red)', dev:'var(--orange)'};
const GROUP_COLOR = {
  'แหล่งสัญญาณ':'var(--violet)', 'ควบคุม/ประมวลผล':'var(--teal)',
  'เครือข่ายหลัก':'var(--yellow)', 'ผลผลิต':'var(--pink)',
  'MAM / ITB':'var(--red)', 'DEVICE':'var(--orange)'
};

function placeInfo(n){
  const br = boardEl.getBoundingClientRect();
  const sx = br.width / 2200, sy = br.height / 1400;
  const w = 270;
  let left = (n.x + 85) * sx - w/2;
  left = Math.max(8, Math.min(left, 2200*sx - w - 8));
  pop.style.left = left + 'px';
  pop.style.top = ((n.y + 60) * sy + 14) + 'px';
}
function showInfo(n){
  const f = n.fmt;
  const title = n.label || LABELS[n.type] || '';
  let rows = `<dt>Video</dt><dd>${esc(f ? (f.video || VIDEO_DEFAULT) : '—')}</dd>`;
  if(f){
    const m = chMap(f);
    const act = CHANNELS.filter(c => m[c] && m[c] !== 'none');
    if(act.length){
      rows += '<dt class="sect">Audio channels</dt>';
      rows += act.map(c => `<dt>${c}</dt><dd>${esc(m[c])}</dd>`).join('');
    } else {
      rows += '<dt>Audio channels</dt><dd>ไม่มีช่องเสียง</dd>';
    }
  } else {
    rows += '<dt>Audio channels</dt><dd>—</dd>';
  }
  pop.innerHTML = `
    <h4><span class="dot" style="background:${CAT_COLOR[CAT[n.type]] || '#9AA0A8'}"></span>${esc(title)}</h4>
    <dl>${rows}</dl>
    <p class="close-hint">คลิกพื้นที่ว่างเพื่อปิด</p>`;
  infoNode = n;
  placeInfo(n);
  pop.classList.add('open');
}
function hideInfo(){ pop.classList.remove('open'); infoNode = null; }
boardEl.addEventListener('click', ()=>{
  if(infoNode) hideInfo();
  if(selectedNode){ selectedNode = null; render(); }
});

function buildPalette(){
  const root = document.getElementById('palette');
  GROUPS.forEach(([title, types])=>{
    const h = document.createElement('h2');
    h.textContent = title;
    if(GROUP_COLOR[title]) h.style.color = GROUP_COLOR[title];
    root.appendChild(h);
    types.forEach(t=>{
      const b = document.createElement('button');
      b.className='pitem'; b.innerHTML = iconSvg(t)+'<span>'+LABELS[t]+'</span>';
      b.onclick = ()=>addNode(t);
      root.appendChild(b);
    });
  });
}

function addNode(type, x, y){
  const id = 'n'+(nextId++);
  const cx = x ?? (120 + (nodes.length%7)*190);
  const cy = y ?? (100 + Math.floor(nodes.length/7)*150);
  nodes.push({id, type, x:cx, y:cy});
  render(); save();
}

function edgePath(a,b){
  const w=170, h=60;
  let sx, sy, ex, ey;
  if(a.x + w <= b.x){ sx=a.x+w; sy=a.y+h/2; ex=b.x; ey=b.y+h/2; }
  else if(b.x + w <= a.x){ sx=a.x; sy=a.y+h/2; ex=b.x+w; ey=b.y+h/2; }
  else if(a.y <= b.y){ sx=a.x+w/2; sy=a.y+h; ex=b.x+w/2; ey=b.y; }
  else { sx=a.x+w/2; sy=a.y; ex=b.x+w/2; ey=b.y+h; }
  const dx = Math.max(Math.abs(ex-sx)*0.5, 40);
  const c1x = sx + (ex>=sx? dx : -dx), c1y = sy;
  const c2x = ex - (ex>=sx? dx : -dx), c2y = ey;
  return `M${sx},${sy} C${c1x},${c1y} ${c2x},${c2y} ${ex},${ey}`;
}
function render(){
  svgNodes.innerHTML=''; svgEdges.innerHTML='';
  edges.forEach(e=>{
    const a = nodes.find(n=>n.id===e.from), b = nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','edge'+(selectedEdge===e?' pending':''));
    path.setAttribute('d', edgePath(a,b));
    path.onclick = (ev)=>{ if(viewMode) return; ev.stopPropagation(); selectedEdge = (selectedEdge===e)?null:e; render(); };
    svgEdges.appendChild(path);
  });
  nodes.forEach(n=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const cat = CAT[n.type] ? ' cat-'+CAT[n.type] : '';
    g.setAttribute('class','node'+cat+((pendingFrom===n.id || selectedNode===n.id)?' selected':''));
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
    const fmt = fmtLine(n);
    const two = !!fmt;
    const title = n.label || LABELS[n.type];
    g.innerHTML = `
      <title>${esc(title)}${n.fmt ? ' — ' + fmtDetail(n) : ''}</title>
      <rect width="170" height="60" rx="10"></rect>
      <g class="ic" transform="translate(12,${two?14:20})"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">${ICONS[n.type]}</svg></g>
      <text class="title" x="40" y="${two?27:35}">${esc(title)}</text>
      ${fmt ? `<text class="fmt" x="40" y="43">${esc(clip(fmt,26))}</text>` : ''}
    `;
    g.addEventListener('pointerdown', (ev)=>onNodeDown(ev, n));
    g.addEventListener('dblclick', (ev)=>{
      ev.stopPropagation();
      if(connectMode) return;
      openNodeDialog(n);
    });
    g.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(viewMode){ showInfo(n); return; }
      if(connectMode) return;
      selectedNode = n.id;
      selectedEdge = null;
      render();
    });
    svgNodes.appendChild(g);
  });
}

function removeNode(id){
  nodes = nodes.filter(n=>n.id!==id);
  edges = edges.filter(e=>e.from!==id && e.to!==id);
  if(pendingFrom===id) pendingFrom=null;
  if(selectedNode===id) selectedNode=null;
  if(infoNode && infoNode.id===id) hideInfo();
  render(); save();
}

function onNodeDown(ev, n){
  if(viewMode) return;
  if(connectMode){
    if(!pendingFrom){ pendingFrom = n.id; render(); }
    else if(pendingFrom !== n.id){
      edges.push({from:pendingFrom, to:n.id});
      pendingFrom = null; render(); save();
    }
    return;
  }
  const board = document.getElementById('board');
  const start = board.createSVGPoint();
  const move = (mv)=>{
    const rect = board.getBoundingClientRect();
    const vb = board.viewBox.baseVal;
    const x = (mv.clientX-rect.left)*(vb.width/rect.width) - 85;
    const y = (mv.clientY-rect.top)*(vb.height/rect.height) - 30;
    n.x = Math.max(0,x); n.y = Math.max(0,y);
    render();
  };
  const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); save(); };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}

function setViewMode(on){
  viewMode = on; connectMode = false; pendingFrom = null; selectedEdge = null; selectedNode = null;
  hideInfo();
  document.body.classList.toggle('view-mode', viewMode);
  const btn = document.getElementById('viewToggle');
  btn.classList.toggle('active', viewMode);
  btn.textContent = viewMode ? '✏️ โหมดแก้ไข' : '👁️ โหมดดูอย่างเดียว';
  document.getElementById('hint').textContent = viewMode ? 'โหมดดูอย่างเดียว — ไม่สามารถแก้ไขผังได้ (ดับเบิลคลิกโหนดเพื่อดูรายละเอียด)' : 'คลิกไอคอนซ้ายมือเพื่อเพิ่มโหนด · ดับเบิลคลิกที่โหนดเพื่อดู/แก้ฟอร์แมท · เลือกโหนดแล้วกด Delete เพื่อลบ';
  render();
}
document.getElementById('viewToggle').onclick = ()=> setViewMode(!viewMode);

document.getElementById('connectBtn').onclick = (e)=>{
  connectMode = !connectMode; pendingFrom=null; selectedNode=null;
  e.target.classList.toggle('active', connectMode);
  document.getElementById('hint').textContent = connectMode ? 'คลิกโหนดต้นทาง แล้วคลิกโหนดปลายทาง เพื่อวาดเส้น' : 'คลิกไอคอนซ้ายมือเพื่อเพิ่มโหนด';
  render();
};
document.getElementById('delEdgeBtn').onclick = ()=>{
  if(selectedEdge){ edges = edges.filter(e=>e!==selectedEdge); selectedEdge=null; render(); save(); }
};
document.getElementById('clearBtn').onclick = ()=>{
  if(confirm('ล้างทั้งหมดจริงหรือไม่?')){ nodes=[]; edges=[]; pendingFrom=null; selectedEdge=null; selectedNode=null; render(); save(); }
};

function sanitizeNodes(list){
  const valid = list.filter(n=>n && typeof n==='object' && n.type && LABELS[n.type]);
  let max = 0;
  valid.forEach(n=>{ const m = /^n(\d+)$/.exec(String(n.id||'')); if(m) max = Math.max(max, +m[1]); });
  const seen = new Set();
  const out = valid.map(n=>{
    let id = (typeof n.id==='string' && n.id) ? n.id : 'n'+(++max);
    if(seen.has(id)) id = 'n'+(++max);
    seen.add(id);
    const node = {id, type:n.type, x:isFinite(+n.x)?+n.x:120, y:isFinite(+n.y)?+n.y:100};
    if(typeof n.label==='string' && n.label) node.label = n.label;
    if(n.fmt && typeof n.fmt==='object') node.fmt = n.fmt;
    return node;
  });
  return {nodes:out, nextId:max+1};
}
function importJson(text){
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง'); return false; }
  if(!d || !Array.isArray(d.nodes)){ alert('ไฟล์นี้ไม่ใช่ไฟล์ Workflow ที่ถูกต้อง'); return false; }
  const s = sanitizeNodes(d.nodes);
  if(!s.nodes.length && !confirm('ไม่พบโหนดที่รู้จักในไฟล์นี้ ต้องการเปิดผังว่างหรือไม่?')) return false;
  const ids = new Set(s.nodes.map(n=>n.id));
  nodes = s.nodes;
  edges = (Array.isArray(d.edges) ? d.edges : [])
    .filter(e=>e && ids.has(e.from) && ids.has(e.to))
    .map(e=>({from:e.from, to:e.to}));
  nextId = s.nextId;
  pendingFrom = null; selectedEdge = null; selectedNode = null; hideInfo();
  render(); save();
  document.getElementById('hint').textContent = 'โหลดไฟล์แล้ว — ' + nodes.length + ' โหนด, ' + edges.length + ' เส้น';
  return true;
}
function buildExportJson(){
  return JSON.stringify({app:'broadcast-workflow', version:1, exportedAt:new Date().toISOString(), nodes, edges}, null, 2);
}
function exportJson(){
  const blob = new Blob([buildExportJson()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const ts = new Date(), p = n=>String(n).padStart(2,'0');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'broadcast-workflow-' + ts.getFullYear() + p(ts.getMonth()+1) + p(ts.getDate()) +
               '-' + p(ts.getHours()) + p(ts.getMinutes()) + p(ts.getSeconds()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  document.getElementById('hint').textContent = 'ส่งออกไฟล์แล้ว — ' + nodes.length + ' โหนด, ' + edges.length + ' เส้น';
}
document.getElementById('exportBtn').onclick = exportJson;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = function(){
  const file = this.files && this.files[0];
  this.value = '';
  if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=> importJson(rd.result);
  rd.onerror = ()=> alert('อ่านไฟล์ไม่สำเร็จ');
  rd.readAsText(file);
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({nodes, edges, nextId})); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      nodes = (d.nodes||[]).filter(n=>n && n.type && LABELS[n.type]);
      const ids = new Set(nodes.map(n=>n.id));
      edges = (d.edges||[]).filter(e=>ids.has(e.from) && ids.has(e.to));
      nextId = d.nextId || (nodes.length + 1);
    }
    else { nodes = []; edges = []; nextId = 1; }
  }catch(e){ nodes = []; edges = []; nextId = 1; }
}

buildPalette();
load();
if(new URLSearchParams(location.search).get('view')==='1'){ setViewMode(true); }
render();
</script>
